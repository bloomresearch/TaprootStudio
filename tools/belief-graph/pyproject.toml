[project]
name = "belief-graph"
version = "0.1.0"
description = "An epistemic belief graph with knowledge-gap detection, exposed over MCP."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
graphiti = ["graphiti-core[kuzu]>=0.3", "kuzu>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
belief-graph-mcp = "beliefgraph.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
